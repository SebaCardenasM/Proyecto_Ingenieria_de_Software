<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Estudiante - Prácticas UBB</title>
    <!-- Importando Bootstrap 5 y sus Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        body { background-color: #f4f6f9; }
        .form-control:focus { border-color: #004b85; box-shadow: 0 0 0 0.25rem rgba(0, 75, 133, 0.25); }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark ubb-bg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-mortarboard-fill me-2"></i>VRIP - Prácticas UBB
            </a>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                
                <div class="card shadow border-0 rounded-3">
                    <!-- Encabezado de la Tarjeta -->
                    <div class="card-header bg-white text-center py-4 border-bottom-0">
                        <div class="display-5 text-primary mb-2"><i class="bi bi-person-plus-fill"></i></div>
                        <h3 class="fw-bold mb-0">Registro de Estudiante</h3>
                        <p class="text-muted mb-0 small">Ingrese los datos para enrolar un nuevo alumno al sistema</p>
                    </div>

                    <!-- Cuerpo del Formulario -->
                    <div class="card-body p-4 p-md-5 pt-0">
                        <!-- El th:action apunta al método Post del Controlador -->
                        <form th:action="@{/guardar}" th:object="${estudiante}" method="post">
                            
                            <div class="row g-3">
                                <!-- Campo RUT -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">RUT</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-card-heading"></i></span>
                                        <input type="text" class="form-control" th:field="*{rut}" placeholder="Ej: 12.345.678-9" required>
                                    </div>
                                </div>

                                <!-- Campo Nombre -->
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold text-secondary">Nombre(s)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre" required>
                                    </div>
                                </div>

                                <!-- Campo Apellido -->
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold text-secondary">Apellido(s)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" th:field="*{apellido}" placeholder="Apellido" required>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4 text-muted">

                            <!-- Botones de Acción -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-save me-1"></i> Guardar Registro
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
