<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alumnos Supervisados - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style> .ubb-bg { background-color: #004b85; } </style>
</head>
<body class="bg-light">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/tutor/index}">
                <i class="bi bi-mortarboard-fill me-2"></i>Plataforma de Prácticas
            </a>
            
            <div class="d-flex text-white align-items-center ms-auto">
                <i class="bi bi-person-circle fs-3 me-2"></i>
                <div class="d-flex flex-column text-end me-3">
                    <span class="fw-bold lh-1" th:text="${usuarioActivo != null ? usuarioActivo.nombre + ' ' + usuarioActivo.apellido : 'Tutor'}">Tutor</span>
                    <small class="text-white-50 mt-1" style="font-size: 0.75rem;">TUTOR SUPERVISOR</small>
                </div>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold"><i class="bi bi-list-check me-2"></i>Estudiantes Asignados</h3>
            <a th:href="@{/tutor/index}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver al Inicio</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Estudiante</th>
                            <th>Práctica</th>
                            <th>Centro de Práctica</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="practica : ${practicas}">
                            <td>
                                <span class="fw-bold" th:text="${practica.estudiante.nombre + ' ' + practica.estudiante.apellido}">Nombre</span><br>
                                <small class="text-muted" th:text="${practica.estudiante.correo}">correo@ubb.cl</small>
                            </td>
                            <td>
                                <span th:text="${'Práctica ' + practica.numeroPractica}">Práctica X</span>
                                <span class="badge bg-primary ms-1" th:if="${practica.numeroPractica == 6}">Profesional</span>
                            </td>
                            <td>
                                <span th:text="${practica.centroPractica != null ? practica.centroPractica.nombre : 'No asignado'}">Colegio</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/tutor/estudiante/{id}(id=${practica.id})}" class="btn btn-outline-success btn-sm">
                                    <i class="bi bi-folder2-open me-1"></i> Cargar Pautas
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${practicas.isEmpty()}">
                            <td colspan="4" class="text-center text-muted py-4">No tienes estudiantes asignados actualmente.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
