<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Profesores - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegación Simple -->
    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver al Dashboard
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark"><i class="bi bi-person-vcard-fill text-success me-2"></i>Directorio de Profesores</h3>
            <a th:href="@{/usuarios/registro}" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i> Añadir Profesor</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>RUT</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Correo Institucional</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Iteración de Thymeleaf sobre la lista de profesores -->
                            <tr th:each="profesor : ${profesores}">
                                <td th:text="${profesor.id}">1</td>
                                <td th:text="${profesor.usuario != null ? profesor.usuario.rut : 'Sin RUT'}">12.345.678-9</td>
                                <td th:text="${profesor.usuario != null ? profesor.usuario.nombre : 'Sin Nombre'}">María</td>
                                <td th:text="${profesor.usuario != null ? profesor.usuario.apellido : 'Sin Apellido'}">González</td>
                                <td th:text="${profesor.usuario != null ? profesor.usuario.correo : 'Sin Correo'}">mgonzalez@ubiobio.cl</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(profesores)}">
                                <td colspan="6" class="text-center text-muted py-4">No hay profesores registrados aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
