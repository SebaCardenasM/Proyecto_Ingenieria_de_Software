<!DOCTYPE html>
<!-- Aquí declaramos que vamos a usar Thymeleaf (th) -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Reemplazamos el título dinámicamente -->
    <title th:text="${titulo}">Título de repuesto</title>
</head>
<body>
    
    <h1 th:text="${titulo}">Encabezado de repuesto</h1>
    
    <!-- Aquí Thymeleaf inyectará el mensaje -->
    <p th:text="${mensajeBievenida}">Si ves esto, Thymeleaf falló.</p>

    <!-- Combinando HTML normal con datos dinámicos -->
    <p>Sesión iniciada por: <strong th:text="${usuarioActivo}">Usuario Anónimo</strong></p>

</body>
</html>
