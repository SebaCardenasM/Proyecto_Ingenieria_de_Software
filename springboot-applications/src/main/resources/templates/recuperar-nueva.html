<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .ubb-bg { background-color: #004b85; }
        .login-card { border: none; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.1); overflow: hidden; }
        .login-header { padding: 30px 20px; text-align: center; color: white; }
        .login-logo { max-width: 120px; height: auto; margin-bottom: 12px; }
    </style>
    <link th:href="@{/css/ubb-index.css}" rel="stylesheet">
</head>
<body class="ubb-auth">
<div class="container"><div class="row justify-content-center"><div class="col-md-5 col-lg-4">
<div class="card login-card">
    <div class="login-header ubb-bg">
        <img th:src="@{/images/escudo-monocromatico-oscuro.png}" alt="Escudo Universidad del Bío-Bío" class="login-logo">
        <h4 class="fw-bold mb-0">Recuperar contraseña</h4>
        <p class="mb-0 text-white-50">Paso 3 de 3: nueva contraseña</p>
    </div>
    <div class="card-body p-4">
        <div th:if="${error}" class="alert alert-danger text-center shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        </div>

        <form th:action="@{/recuperar/nueva}" method="post">
            <div class="mb-3">
                <label for="password" class="form-label fw-bold text-secondary">Nueva contraseña</label>
                <input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" required autofocus>
                <div class="form-text">Mínimo 8 caracteres.</div>
            </div>
            <div class="mb-4">
                <label for="confirmar" class="form-label fw-bold text-secondary">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmar" name="confirmar" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary ubb-bg border-0 py-2 fw-bold">Restablecer contraseña <i class="bi bi-key ms-1"></i></button>
            </div>
        </form>

        <div class="text-center mt-3"><a th:href="@{/login}" class="small">Volver al inicio de sesión</a></div>
    </div>
</div>
</div></div></div>

</body>
</html>
