<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Centro de Práctica - Plataforma de Prácticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        body { background-color: #f4f6f9; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/centros-practica}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver a Centros
            </a>
            <div class="d-flex text-white align-items-center">
                <i class="bi bi-person-badge fs-5 me-2"></i> Coordinación
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header ubb-bg text-white py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Centro de Práctica</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/centros-practica/actualizar/{id}(id=${centroPractica.id})}" th:object="${centroPractica}" method="post">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre del Centro</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="region" class="form-label fw-semibold">Región</label>
                                    <input type="text" class="form-control" id="region" th:field="*{region}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="comuna" class="form-label fw-semibold">Comuna</label>
                                    <input type="text" class="form-control" id="comuna" th:field="*{comuna}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-8 mb-4">
                                    <label for="calle" class="form-label fw-semibold">Calle</label>
                                    <input type="text" class="form-control" id="calle" th:field="*{calle}">
                                </div>
                                <div class="col-md-4 mb-4">
                                    <label for="numero" class="form-label fw-semibold">Número</label>
                                    <input type="text" class="form-control" id="numero" th:field="*{numero}">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/centros-practica}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success px-4">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
