<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Profesores - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/index}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver al Dashboard
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark"><i class="bi bi-person-vcard-fill text-success me-2"></i>Directorio de Profesores y Tutores</h3>
            <a th:href="@{/usuarios/registro}" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i> Añadir Académico</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>RUT</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Correo Institucional</th>
                                <th>Roles / Funciones</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="profesor : ${profesores}">
                                <td th:text="${profesor.rut}">11.111.111-1</td>
                                <td th:text="${profesor.nombre}">María</td>
                                <td th:text="${profesor.apellido}">González</td>
                                <td th:text="${profesor.correo}">mgonzalez@ubiobio.cl</td>
                                
                                <!-- Badges con los roles asignados al profesor -->
                                <td>
                                    <span th:if="${profesor.hasRol(T(com.proyectoubbconfig.iswspring.app1.springboot_applications.models.Rol).PROFESOR_ASIGNATURA)}" 
                                          class="badge bg-primary me-1">
                                        <i class="bi bi-book me-1"></i>Profesor Asignatura
                                    </span>
                                    <span th:if="${profesor.hasRol(T(com.proyectoubbconfig.iswspring.app1.springboot_applications.models.Rol).TUTOR)}" 
                                          class="badge bg-info text-dark me-1">
                                        <i class="bi bi-geo-alt me-1"></i>Tutor Supervisor
                                    </span>
                                    <span th:if="${profesor.hasRol(T(com.proyectoubbconfig.iswspring.app1.springboot_applications.models.Rol).COORDINADOR)}" 
                                          class="badge bg-warning text-dark">
                                        <i class="bi bi-shield-check me-1"></i>Coordinador
                                    </span>
                                </td>

                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(profesores)}">
                                <td colspan="6" class="text-center text-muted py-4">No hay profesores ni tutores registrados aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
