<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Profesor Colaborador - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        body { background-color: #f4f6f9; }
    </style>
    <link th:href="@{/css/ubb-index.css}" rel="stylesheet">
</head>
<body class="ubb-page ubb-inner">

    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center"><img th:src="@{/images/escudo-monocromatico-oscuro.png}" alt="Escudo Universidad del Bío-Bío" class="nav-logo"><a class="navbar-brand fw-bold" th:href="@{/colaboradores}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver a Colaboradores
            </a></div>
            <div class="d-flex text-white align-items-center">
                <i class="bi bi-person-badge fs-5 me-2"></i> Coordinación
            </div>
        </div>
    </nav>

    <div class="container py-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div th:if="${error}" class="alert alert-danger shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header ubb-bg text-white py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Profesor Colaborador</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/colaboradores/actualizar/{rut}(rut=${colaborador.rut})}" th:object="${colaborador}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">RUT</label>
                                <input type="text" class="form-control" th:value="${colaborador.rut}" disabled>
                                <div class="form-text">El RUT identifica al colaborador y no se puede modificar.</div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre(s) *</label>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label fw-semibold">Apellido(s) *</label>
                                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" maxlength="100" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo electrónico *</label>
                                <input type="email" class="form-control" id="correo" th:field="*{correo}" maxlength="150" required>
                            </div>

                            <div class="mb-4">
                                <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" th:field="*{telefono}" maxlength="20"
                                       placeholder="+56 9 1234 5678">
                                <div class="form-text">Opcional. Lo verá el estudiante en «Mi Práctica».</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/colaboradores}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success px-4">Guardar cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Footer -->
    <footer class="ubb-footer compact">
        <div class="container py-3 d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 text-center text-md-start">
            <div class="d-flex align-items-center gap-3">
                <img th:src="@{/images/escudo-monocromatico-oscuro.png}" alt="Escudo Universidad del Bío-Bío" class="footer-logo">
                <div>
                    <div class="fw-bold">Universidad del Bío-Bío</div>
                    <small>Escuela de Pedagogía en Educación Matemática</small>
                </div>
            </div>
            <small>Plataforma de Prácticas · &copy; <span class="anio"></span></small>
        </div>
    </footer>
    <script>document.querySelectorAll(".anio").forEach(e => e.textContent = new Date().getFullYear());</script>
</body>
</html>
