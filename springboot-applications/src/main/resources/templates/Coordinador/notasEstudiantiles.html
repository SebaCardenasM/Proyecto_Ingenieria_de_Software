<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notas Estudiantiles - Prácticas Educación Matemática</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        .filtro-par { display: flex; gap: 2px; }
        .filtro-par select { flex: none; width: 58px; }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/index}">
                <i class="bi bi-mortarboard-fill me-2"></i>Plataforma de Prácticas
            </a>

            <div class="d-flex text-white align-items-center ms-auto">
                <i class="bi bi-person-circle fs-3 me-2"></i>
                <div class="d-flex flex-column text-end me-3">
                    <span class="fw-bold lh-1" th:text="${usuarioActivo != null ? usuarioActivo.nombre + ' ' + usuarioActivo.apellido : 'Usuario'}">Usuario</span>
                    <small class="text-white-50 mt-1" style="font-size: 0.75rem;" th:text="${#strings.arrayJoin(rolesUsuario, ', ')}">COORDINADOR</small>
                </div>

                <div th:if="${rolesUsuario != null and rolesUsuario.size() > 1}" class="me-2">
                    <a th:href="@{/seleccionar-rol}" class="btn btn-outline-light btn-sm" title="Cambiar de perfil">
                        <i class="bi bi-person-gear"></i> Cambiar Perfil
                    </a>
                </div>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold text-dark mb-0">Notas Estudiantiles</h2>
            <a th:href="@{/index}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al panel
            </a>
        </div>

        <form method="get" th:action="@{/practicas/notas}">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm align-middle text-center mb-0">
                        <thead class="table-light">
                        <!-- Fila de filtros -->
                        <tr>
                            <th><input type="text" name="rut" class="form-control form-control-sm" placeholder="Buscar" th:value="${filtro.rut}"></th>
                            <th><input type="text" name="nombre" class="form-control form-control-sm" placeholder="Buscar" th:value="${filtro.nombre}"></th>
                            <th>
                                <div class="filtro-par">
                                    <select name="anoOp" class="form-select form-select-sm">
                                        <option value="">—</option>
                                        <option value="gt"  th:selected="${filtro.anoOp == 'gt'}">&gt;</option>
                                        <option value="gte" th:selected="${filtro.anoOp == 'gte'}">≥</option>
                                        <option value="lt"  th:selected="${filtro.anoOp == 'lt'}">&lt;</option>
                                        <option value="lte" th:selected="${filtro.anoOp == 'lte'}">≤</option>
                                        <option value="eq"  th:selected="${filtro.anoOp == 'eq'}">=</option>
                                    </select>
                                    <input type="text" name="anoVal" class="form-control form-control-sm" th:value="${filtro.anoVal}">
                                </div>
                            </th>
                            <th th:each="i : ${#numbers.sequence(0, 5)}">
                                <div class="filtro-par">
                                    <select th:name="${'op' + (i + 1)}" class="form-select form-select-sm">
                                        <option value="">—</option>
                                        <option value="gt"  th:selected="${filtro.ops[i] == 'gt'}">&gt;</option>
                                        <option value="gte" th:selected="${filtro.ops[i] == 'gte'}">≥</option>
                                        <option value="lt"  th:selected="${filtro.ops[i] == 'lt'}">&lt;</option>
                                        <option value="lte" th:selected="${filtro.ops[i] == 'lte'}">≤</option>
                                        <option value="eq"  th:selected="${filtro.ops[i] == 'eq'}">=</option>
                                    </select>
                                    <input type="text" th:name="${'val' + (i + 1)}" class="form-control form-control-sm" th:value="${filtro.vals[i]}">
                                </div>
                            </th>
                        </tr>
                        <!-- Encabezados -->
                        <tr>
                            <th>Rut</th>
                            <th>Nombre</th>
                            <th>Año ingreso</th>
                            <th th:each="i : ${#numbers.sequence(1, 6)}" th:text="${'Nota P' + i}"></th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="f : ${filas}">
                            <td th:text="${f.rut}"></td>
                            <td class="text-start" th:text="${f.nombreCompleto}"></td>
                            <td th:text="${f.anoIngreso}"></td>
                            <td th:each="n : ${f.notas}"
                                th:classappend="${n == null} ? 'text-muted' : (${n < 4.0} ? 'text-danger fw-bold' : '')"
                                th:text="${n != null} ? ${#numbers.formatDecimal(n, 1, 'POINT', 1, 'COMMA')} : '—'"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(filas)}">
                            <td colspan="9" class="text-muted py-4">Sin resultados</td>
                        </tr>
                        </tbody>

                        <tfoot class="table-light fw-bold">
                        <tr>
                            <td th:text="${'Total: ' + total}"></td>
                            <td></td>
                            <td></td>
                            <td th:each="p : ${promedios}"
                                th:text="${p != null} ? ${#numbers.formatDecimal(p, 1, 'POINT', 1, 'COMMA')} : '—'"></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3 mb-4">
                <a th:href="@{/practicas/notas}" class="btn btn-outline-secondary">Limpiar</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel me-1"></i> Filtrar</button>
                <!-- Exporta con los mismos filtros del formulario -->
                <button type="submit" th:formaction="@{/practicas/notas/export}" class="btn btn-outline-success">
                    <i class="bi bi-filetype-csv me-1"></i> Exportar a CSV
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
