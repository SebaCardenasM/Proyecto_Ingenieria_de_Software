<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Profesor - Plataforma de Prácticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        body { background-color: #f4f6f9; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/profesores}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver a Profesores
            </a>
            <div class="d-flex text-white align-items-center">
                <i class="bi bi-person-badge fs-5 me-2"></i> Coordinación
            </div>
        </div>
    </nav>

    <div class="container py-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header ubb-bg text-white py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Profesor / Tutor</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/profesores/actualizar/{rut}(rut=${rut})}" th:object="${usuario}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">RUT</label>
                                <input type="text" class="form-control" th:value="${rut}" disabled>
                                <div class="form-text">El RUT identifica al usuario y no se puede modificar.</div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre(s) *</label>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label fw-semibold">Apellido(s) *</label>
                                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo Institucional *</label>
                                <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Roles / Funciones *</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rolProfesor" th:field="*{roles}" value="PROFESOR_ASIGNATURA">
                                    <label class="form-check-label" for="rolProfesor">Profesor de Asignatura</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rolTutor" th:field="*{roles}" value="TUTOR">
                                    <label class="form-check-label" for="rolTutor">Tutor Supervisor</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rolCoordinador" th:field="*{roles}" value="COORDINADOR">
                                    <label class="form-check-label" for="rolCoordinador">Coordinador</label>
                                </div>
                                <div class="form-text">Los cambios de rol se aplican la próxima vez que la persona inicie sesión.</div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password">
                                <div class="form-text">Déjala en blanco para mantener la contraseña actual.</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/profesores}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success px-4">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
