<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Usuario - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        body { background-color: #f4f6f9; }
        .form-control:focus, .form-select:focus { border-color: #004b85; box-shadow: 0 0 0 0.25rem rgba(0, 75, 133, 0.25); }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark ubb-bg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/index}">
                <i class="bi bi-mortarboard-fill me-2"></i>VRIP - Prácticas UBB
            </a>
            <a th:href="@{/index}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-white text-center py-4 border-bottom-0">
                        <div class="display-5 text-primary mb-2"><i class="bi bi-person-plus-fill"></i></div>
                        <h3 class="fw-bold mb-0">Registro de Usuario</h3>
                        <p class="text-muted mb-0 small">Ingrese los datos para enrolar en el sistema</p>
                    </div>

                    <div class="card-body p-4 p-md-5 pt-0">
                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                            
                            <div class="row g-3">
                                <!-- Selección de Rol Adaptado -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">Tipo de Usuario / Rol Principal</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                        <select class="form-select" th:field="*{rol}" required>
                                            <option value="" disabled selected>Seleccione un perfil...</option>
                                            <option value="ESTUDIANTE">Estudiante de Pedagogía</option>
                                            <option value="PROFESOR_ASIGNATURA">Profesor de Asignatura (Cátedra)</option>
                                            <option value="TUTOR">Tutor Supervisor (Supervisación Terreno / Honorarios)</option>
                                            <option value="COORDINADOR">Coordinador de Prácticas / Administrador</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Campo RUT -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">RUT</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-card-heading"></i></span>
                                        <input type="text" class="form-control" th:field="*{rut}" id="rutInput" placeholder="Ej: 12345678-9" maxlength="12" required>
                                        <div class="invalid-feedback">El RUT ingresado no es válido.</div>
                                    </div>
                                </div>

                                <!-- Campo Nombre -->
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold text-secondary">Nombre(s)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre" required>
                                    </div>
                                </div>

                                <!-- Campo Apellido -->
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold text-secondary">Apellido(s)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" th:field="*{apellido}" placeholder="Apellido" required>
                                    </div>
                                </div>

                                <!-- Campo Correo -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">Correo Electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" th:field="*{correo}" placeholder="ejemplo@ubiobio.cl" required>
                                    </div>
                                </div>

                                <!-- Campo Contraseña -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" th:field="*{password}" placeholder="********" required>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4 text-muted">

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/index}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-save me-1"></i> Registrar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const rutInput = document.getElementById('rutInput');
        const form = rutInput.closest('form');

        rutInput.addEventListener('input', function(e) {
            let valor = e.target.value.replace(/[^0-9kK]/g, '').toUpperCase();
            if (valor.length > 1) {
                let cuerpo = valor.slice(0, -1);
                let dv = valor.slice(-1);
                cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                e.target.value = cuerpo + "-" + dv;
            } else {
                e.target.value = valor;
            }
            rutInput.classList.remove('is-invalid');
        });

        form.addEventListener('submit', function(e) {
            if (!validarRut(rutInput.value)) {
                e.preventDefault(); 
                rutInput.classList.add('is-invalid'); 
            }
        });

        function validarRut(rutCompleto) {
            if (!/^[0-9.]+-[0-9kK]{1}$/.test(rutCompleto)) return false;
            let valor = rutCompleto.replace(/\./g, '');
            let cuerpo = valor.slice(0, -2);
            let dv = valor.slice(-1).toUpperCase();
            let suma = 0;
            let multiplo = 2;
            for (let i = 1; i <= cuerpo.length; i++) {
                let index = multiplo * valor.charAt(cuerpo.length - i);
                suma = suma + index;
                multiplo = multiplo < 7 ? multiplo + 1 : 2;
            }
            let dvEsperado = 11 - (suma % 11);
            let dvCalculado = (dvEsperado === 11) ? "0" : (dvEsperado === 10) ? "K" : dvEsperado.toString();
            return dvCalculado === dv;
        }
    });
</script>
</body>
</html>
