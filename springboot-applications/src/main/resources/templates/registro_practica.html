<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asignar Práctica - Prácticas UBB</title>
    <!-- Importando Bootstrap 5 y sus Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
        body { background-color: #f4f6f9; }
        .form-control:focus, .form-select:focus { border-color: #ffc107; box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25); }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark ubb-bg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-mortarboard-fill me-2"></i>VRIP - Prácticas UBB
            </a>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-white text-center py-4 border-bottom-0">
                        <div class="display-5 text-warning mb-2"><i class="bi bi-briefcase-fill"></i></div>
                        <h3 class="fw-bold mb-0">Asignación de Práctica</h3>
                        <p class="text-muted mb-0 small">Registre el periodo y detalles de la práctica del estudiante</p>
                    </div>

                    <div class="card-body p-4 p-md-5 pt-0">
                        <!-- El formulario apunta al controlador /practicas/guardar -->
                        <form th:action="@{/practicas/guardar}" th:object="${practica}" method="post">
                            
                            <div class="row g-3">
                                
                                <!-- Campo Año -->
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold text-secondary">Año Académico</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-warning"><i class="bi bi-calendar"></i></span>
                                        <!-- Usamos th:field="*{ano}" -->
                                        <input type="number" class="form-control" th:field="*{ano}" placeholder="Ej: 2026" required>
                                    </div>
                                </div>

                                <!-- Campo Semestre -->
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold text-secondary">Semestre</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-warning"><i class="bi bi-calendar-half"></i></span>
                                        <!-- Usamos th:field="*{semestre}" -->
                                        <select class="form-select" th:field="*{semestre}">
                                            <option value="1">Primer Semestre (1)</option>
                                            <option value="2">Segundo Semestre (2)</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Número de Práctica -->
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">N° de Práctica</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-warning"><i class="bi bi-hash"></i></span>
                                        <!-- Usamos th:field="*{numeroPractica}" -->
                                        <input type="number" class="form-control" th:field="*{numeroPractica}" placeholder="1 o 2" required>
                                    </div>
                                </div>

                                <!-- Nota de Aprobación -->
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">Nota (Opcional)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-warning"><i class="bi bi-123"></i></span>
                                        <!-- Usamos th:field="*{notaAprobacion}" y step="0.1" para permitir decimales -->
                                        <input type="number" step="0.1" class="form-control" th:field="*{notaAprobacion}" placeholder="Ej: 6.5">
                                    </div>
                                </div>

                                <!-- Aprobación (Booleano) -->
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">Aprobación</label>
                                    <!-- Usamos th:field="*{aprobacion}" -->
                                    <select class="form-select" th:field="*{aprobacion}">
                                        <option value="false">Pendiente / Reprobada</option>
                                        <option value="true">Aprobada</option>
                                    </select>
                                </div>

                                <!-- NOTA SOBRE LAS RELACIONES (Estudiante y Profesor) -->
                                <!-- Por ahora están ocultas hasta que pasemos las listas desde el Controlador -->
                                
                            </div>

                            <hr class="my-4 text-muted">

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-warning px-4 shadow-sm text-dark fw-semibold">
                                    <i class="bi bi-save me-1"></i> Guardar Práctica
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
