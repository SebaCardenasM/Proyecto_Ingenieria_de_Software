<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Práctica - UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/practicas}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver a Prácticas
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header ubb-bg text-white fw-bold">
                        <i class="bi bi-journal-plus me-2"></i>Registrar Nueva Práctica
                    </div>
                    <div class="card-body p-4">

                        <!-- Alerta por si la fecha fin es anterior a la de inicio -->
                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                        <form th:action="@{/practicas/guardar}" th:object="${practica}" method="post">
                            
                            <!-- Selección de Estudiante por RUT -->
                            <div class="mb-3">
                                <label for="estudiante" class="form-label fw-semibold">Estudiante</label>
                                <select id="estudiante" class="form-select" th:field="*{estudiante.rut}" required>
                                    <option value="" selected disabled>Seleccione un estudiante</option>
                                    <option th:each="e : ${estudiantes}" 
                                            th:value="${e.rut}" 
                                            th:text="${e.nombre + ' ' + e.apellido + ' (' + e.rut + ')'}">
                                    </option>
                                </select>
                            </div>

                            <!-- Selección de Profesor por RUT -->
                            <div class="mb-3">
                                <label for="profesor" class="form-label fw-semibold">Profesor Supervisor</label>
                                <select id="profesor" class="form-select" th:field="*{profesor.rut}" required>
                                    <option value="" selected disabled>Seleccione un profesor</option>
                                    <option th:each="p : ${profesores}" 
                                            th:value="${p.rut}" 
                                            th:text="${p.nombre + ' ' + p.apellido + ' (' + p.rut + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="row">
                                <!-- Número de Práctica ampliado hasta 6 -->
                                <div class="col-md-4 mb-3">
                                    <label for="numeroPractica" class="form-label fw-semibold">N° Práctica</label>
                                    <input type="number" id="numeroPractica" class="form-control" th:field="*{numeroPractica}" min="1" max="6" required>
                                </div>

                                <!-- Año -->
                                <div class="col-md-4 mb-3">
                                    <label for="ano" class="form-label fw-semibold">Año</label>
                                    <input type="number" id="ano" class="form-control" th:field="*{ano}" placeholder="Ej: 2026" required>
                                </div>

                                <!-- Semestre -->
                                <div class="col-md-4 mb-3">
                                    <label for="semestre" class="form-label fw-semibold">Semestre</label>
                                    <select id="semestre" class="form-select" th:field="*{semestre}" required>
                                        <option value="1">Semestre 1</option>
                                        <option value="2">Semestre 2</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Fecha de Inicio -->
                                <div class="col-md-6 mb-3">
                                    <label for="fechaInicio" class="form-label fw-semibold">Fecha Inicio</label>
                                    <input type="date" id="fechaInicio" class="form-control" th:field="*{fechaInicio}">
                                </div>

                                <!-- Fecha de Fin -->
                                <div class="col-md-6 mb-3">
                                    <label for="fechaFin" class="form-label fw-semibold">Fecha Fin</label>
                                    <input type="date" id="fechaFin" class="form-control" th:field="*{fechaFin}">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/practicas}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar Práctica</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
