<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Prácticas UBB</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ubb-bg { background-color: #004b85; }
        .login-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .login-header {
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        /* Estilo para ajustar el tamaño del logo institucional */
        .login-logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    
                    <div class="login-header ubb-bg">
                        <!-- Logo institucional con el nombre exacto solicitado -->
                        <img th:src="@{/images/escudo-monocromatico-oscuro.png}" alt="Escudo Universidad del Bío-Bío" class="login-logo">
                        <h4 class="fw-bold mb-0">Prácticas UBB</h4>
                        <p class="mb-0 text-white-50">Acceso a la plataforma</p>
                    </div>

                    <div class="card-body p-4">
                        
                        <!-- Mensaje de Error Actualizado -->
                        <div th:if="${param.error}" class="alert alert-danger text-center shadow-sm" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>RUT o contraseña incorrectos.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success text-center shadow-sm" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>Has cerrado sesión correctamente.
                        </div>

                        <div th:if="${param.registrado}" class="alert alert-success text-center shadow-sm" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>Usuario registrado. Inicia sesión.
                        </div>

                        <form th:action="@{/login}" method="post">
                            
                           <div class="mb-3">
                                <label for="rutLogin" class="form-label fw-bold text-secondary">RUT</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                    <input type="text" class="form-control" id="rutLogin" name="rut" placeholder="Ej: 12345678-9" maxlength="12" required autofocus>
                                    <div class="invalid-feedback">El RUT ingresado no es válido.</div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold text-secondary">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary ubb-bg border-0 py-2 fw-bold">
                                    Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-1"></i>
                                </button>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const rutInput = document.getElementById('rutLogin'); 
            const form = rutInput.closest('form');

            // Formatear mientras el usuario escribe
            rutInput.addEventListener('input', function(e) {
                let valor = e.target.value;
                valor = valor.replace(/[^0-9kK]/g, '').toUpperCase();
                
                if (valor.length > 1) {
                    let cuerpo = valor.slice(0, -1);
                    let dv = valor.slice(-1);
                    cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                    e.target.value = cuerpo + "-" + dv;
                } else {
                    e.target.value = valor;
                }
                rutInput.classList.remove('is-invalid');
            });

            // Validar el Módulo 11 cuando intenta enviar el formulario
            form.addEventListener('submit', function(e) {
                if (!validarRut(rutInput.value)) {
                    e.preventDefault(); 
                    rutInput.classList.add('is-invalid'); 
                }
            });

            function validarRut(rutCompleto) {
                if (!/^[0-9.]+-[0-9kK]{1}$/.test(rutCompleto)) return false;
                
                let valor = rutCompleto.replace(/\./g, '');
                let cuerpo = valor.slice(0, -2);
                let dv = valor.slice(-1).toUpperCase();
                
                let suma = 0;
                let multiplo = 2;
                
                for (let i = 1; i <= cuerpo.length; i++) {
                    let index = multiplo * valor.charAt(cuerpo.length - i);
                    suma = suma + index;
                    multiplo = multiplo < 7 ? multiplo + 1 : 2;
                }
                
                let dvEsperado = 11 - (suma % 11);
                let dvCalculado = (dvEsperado === 11) ? "0" : (dvEsperado === 10) ? "K" : dvEsperado.toString();
                
                return dvCalculado === dv;
            }
        });
    </script>

</body>
</html>
