<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Prácticas UBB</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ubb-bg { background-color: #004b85; }
        .login-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .login-header {
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    
                    <div class="login-header ubb-bg">
                        <i class="bi bi-mortarboard-fill display-4 mb-2"></i>
                        <h4 class="fw-bold mb-0">VRIP Prácticas UBB</h4>
                        <p class="mb-0 text-white-50">Acceso a la plataforma</p>
                    </div>

                    <div class="card-body p-4">
                        
                        <!-- Mensaje de Error Actualizado -->
                        <div th:if="${param.error}" class="alert alert-danger text-center shadow-sm" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>RUT o contraseña incorrectos.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success text-center shadow-sm" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>Has cerrado sesión correctamente.
                        </div>

                        <div th:if="${param.registrado}" class="alert alert-success text-center shadow-sm" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>Usuario registrado. Inicia sesión.
                        </div>

                        <form th:action="@{/login}" method="post">
                            
                            <div class="mb-3">
                                <label for="rut" class="form-label fw-bold text-secondary">RUT Institucional</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-card-heading"></i></span>
                                    <input type="text" class="form-control" id="rut" name="rut" placeholder="11.111.111-1" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold text-secondary">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary ubb-bg border-0 py-2 fw-bold">
                                    Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-1"></i>
                                </button>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
