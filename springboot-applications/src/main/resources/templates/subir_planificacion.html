<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Planificación - VRIP UBB</title>
    <!-- Incluyendo Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Subir Planificación de Práctica</h4>
                </div>
                <div class="card-body">
                    
                    <!-- ¡ATENCIÓN! El enctype="multipart/form-data" es obligatorio para archivos -->
                    <form th:action="@{/planificaciones/subir}" method="post" enctype="multipart/form-data">
                        
                        <!-- Input para el ID de la Práctica (Más adelante lo cambiaremos por un desplegable dinámico) -->
                        <div class="mb-3">
                            <label for="practicaId" class="form-label fw-bold">ID de la Práctica asignada:</label>
                            <input type="number" class="form-control" id="practicaId" name="practicaId" required placeholder="Ej: 1">
                            <div class="form-text">Por ahora ingresaremos el ID de la práctica manualmente.</div>
                        </div>

                        <!-- Input para el archivo PDF -->
                        <div class="mb-4">
                            <label for="archivoPdf" class="form-label fw-bold">Documento PDF:</label>
                            <input class="form-control" type="file" id="archivoPdf" name="archivoPdf" accept="application/pdf" required>
                            <div class="form-text">Solo se permiten archivos en formato .pdf</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">
                                Guardar Planificación
                            </button>
                            <a href="/" class="btn btn-outline-secondary">Cancelar y volver al Inicio</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
