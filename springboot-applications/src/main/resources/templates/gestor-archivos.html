<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Archivos - Plataforma Prácticas UBB</title>
    <!-- Incluimos Bootstrap para darle estilo rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="text-primary">Gestor de Archivos del Estudiante</h2>
            <p class="text-muted">Sube y administra tus informes, anexos y guías de aprendizaje.</p>
        </div>
    </div>

    <!-- Sección de Subida de Archivos -->
    <div class="card shadow-sm mb-5">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Subir Nuevo Documento</h5>
        </div>
        <div class="card-body">
            <form id="formularioSubida" enctype="multipart/form-data">
                <div class="input-group mb-3">
                    <input type="file" class="form-control" id="archivoInput" name="archivo" required>
                    <button class="btn btn-success" type="submit" id="btnSubir">
                        Subir Archivo
                    </button>
                </div>
                <div id="mensajeAlerta" class="alert d-none" role="alert"></div>
            </form>
        </div>
    </div>

    <!-- Sección de Listado de Archivos -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Mis Documentos Subidos</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Nombre del Archivo</th>
                        <th>Fecha de Subida</th>
                        <th>Ruta en Servidor</th>
                    </tr>
                </thead>
                <tbody id="tablaArchivos">
                    <!-- Aquí se inyectarán los archivos con JavaScript -->
                    <tr>
                        <td colspan="4" class="text-center text-muted">Cargando documentos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Script para conectar la vista con tu @RestController -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        cargarArchivos();

        // Manejar el evento de subida del formulario
        const formulario = document.getElementById('formularioSubida');
        formulario.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            const inputArchivo = document.getElementById('archivoInput');
            const alerta = document.getElementById('mensajeAlerta');
            const formData = new FormData();
            formData.append("archivo", inputArchivo.files[0]);

            try {
                // Hacemos el POST a tu controlador /api/estudiante/archivos/subir
                const respuesta = await fetch('/api/estudiante/archivos/subir', {
                    method: 'POST',
                    body: formData
                });

                if (respuesta.ok) {
                    mostrarAlerta('¡Archivo subido con éxito!', 'alert-success');
                    formulario.reset();
                    cargarArchivos(); // Recargar la tabla
                } else {
                    const error = await respuesta.text();
                    mostrarAlerta('Error: ' + error, 'alert-danger');
                }
            } catch (error) {
                mostrarAlerta('Error de conexión con el servidor.', 'alert-danger');
            }
        });
    });

    // Función para obtener y pintar la lista de archivos desde tu GET
    async function cargarArchivos() {
        const tabla = document.getElementById('tablaArchivos');
        
        try {
            // Llama a tu controlador /api/estudiante/archivos/mis-documentos
            const respuesta = await fetch('/api/estudiante/archivos/mis-documentos');
            
            if (respuesta.status === 204) {
                tabla.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Aún no has subido ningún documento.</td></tr>';
                return;
            }

            const archivos = await respuesta.json();
            tabla.innerHTML = ''; // Limpiar la tabla

            archivos.forEach((archivo, index) => {
                const fila = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${archivo.nombreArchivo}</strong></td>
                        <td>${new Date(archivo.fechaSubida).toLocaleString()}</td>
                        <td><span class="badge bg-info text-dark">${archivo.rutaServidor}</span></td>
                    </tr>
                `;
                tabla.insertAdjacentHTML('beforeend', fila);
            });
        } catch (error) {
            tabla.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error al cargar los documentos.</td></tr>';
        }
    }

    // Función auxiliar para mostrar mensajes
    function mostrarAlerta(mensaje, clase) {
        const alerta = document.getElementById('mensajeAlerta');
        alerta.className = `alert ${clase} mt-3`;
        alerta.textContent = mensaje;
        setTimeout(() => alerta.className = 'alert d-none', 4000);
    }
</script>

</body>
</html>
