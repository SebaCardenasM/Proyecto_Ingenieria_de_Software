<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .ubb-bg { background-color: #004b85; }
        .login-card { border: none; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.1); overflow: hidden; }
        .login-header { padding: 30px 20px; text-align: center; color: white; }
        .login-logo { max-width: 120px; height: auto; margin-bottom: 12px; }
    </style>
    <link th:href="@{/css/ubb-index.css}" rel="stylesheet">
</head>
<body class="ubb-auth">
<div class="container"><div class="row justify-content-center"><div class="col-md-5 col-lg-4">
<div class="card login-card">
    <div class="login-header ubb-bg">
        <img th:src="@{/images/escudo-monocromatico-oscuro.png}" alt="Escudo Universidad del Bío-Bío" class="login-logo">
        <h4 class="fw-bold mb-0">Recuperar contraseña</h4>
        <p class="mb-0 text-white-50">Paso 2 de 3: código</p>
    </div>
    <div class="card-body p-4">
        <div th:if="${error}" class="alert alert-danger text-center shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        </div>

        <p class="text-muted small">Si el RUT existe, enviamos un código de 6 dígitos a <strong th:text="${correo}">correo</strong>. Vence en 10 minutos.</p>
        <form th:action="@{/recuperar/verificar}" method="post">
            <div class="mb-3">
                <label for="codigo" class="form-label fw-bold text-secondary">Código de verificación</label>
                <input type="text" class="form-control form-control-lg text-center" id="codigo" name="codigo"
                       inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" required autofocus>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary ubb-bg border-0 py-2 fw-bold">Verificar <i class="bi bi-shield-check ms-1"></i></button>
            </div>
        </form>
        <div class="text-center mt-2"><a th:href="@{/recuperar}" class="small">¿No llegó? Pedir un nuevo código</a></div>

        <div class="text-center mt-3"><a th:href="@{/login}" class="small">Volver al inicio de sesión</a></div>
    </div>
</div>
</div></div></div>

</body>
</html>
