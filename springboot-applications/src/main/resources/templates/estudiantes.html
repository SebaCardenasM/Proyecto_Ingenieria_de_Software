<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Estudiantes - Prácticas UBB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .ubb-bg { background-color: #004b85; }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegación Simple -->
    <nav class="navbar navbar-dark ubb-bg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-arrow-left-circle me-2"></i>Volver al Dashboard
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark"><i class="bi bi-people-fill text-primary me-2"></i>Directorio de Estudiantes</h3>
            <a th:href="@{/usuarios/registro}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i> Añadir Estudiante</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>RUT</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Correo Electrónico</th>
                                <th>Año Ingreso</th>
                                <th>Práctica Actual</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Iteración directa sobre las propiedades heredadas de Usuario y propias de Estudiante -->
                            <tr th:each="estudiante : ${estudiantes}">
                                <td th:text="${estudiante.rut}">11.111.111-1</td>
                                <td th:text="${estudiante.nombre}">Juan</td>
                                <td th:text="${estudiante.apellido}">Pérez</td>
                                <td th:text="${estudiante.correo}">juan.perez@alumnos.ubiobio.cl</td>
                                <td th:text="${estudiante.anoIngreso != null ? estudiante.anoIngreso : 'N/A'}">2024</td>
                                <td th:text="${estudiante.practicaActual != null ? estudiante.practicaActual : 'Sin asignar'}">1</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(estudiantes)}">
                                <td colspan="7" class="text-center text-muted py-4">No hay estudiantes registrados aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
