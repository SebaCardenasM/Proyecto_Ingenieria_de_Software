# Nombre de tu aplicación
spring.application.name=springboot-applications

# URL de la base de datos en tu XAMPP local
spring.datasource.url=jdbc:mysql://localhost:3306/practicas_db?serverTimezone=UTC

# Credenciales por defecto de XAMPP
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA (Crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL en la consola 
spring.jpa.show-sql=true