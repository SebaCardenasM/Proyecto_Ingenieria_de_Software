# Nombre de tu aplicación
spring.application.name=springboot-applications
# Importar variables desde .env si existe


# Variables de entorno con valores por defecto para la BD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practicas_db?serverTimezone=UTC}
spring.datasource.username=${DB_USER:app_practicas}
spring.datasource.password=${DB_PASSWORD:TuClaveSegura2026!}

# Configuración de JPA (Crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.config.import=optional:file:.env[.properties],optional:file:springboot-applications/.env[.properties]
gemini.api.key=TEST_KEY_TEMPORAL
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:no-reply@ubiobio.cl}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# false = la revisión con el asistente es opcional | true = obligatoria antes de enviar al gestor
documentos.revision-ia.obligatoria=false

# Sin esto Spring solo acepta archivos de 1 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
