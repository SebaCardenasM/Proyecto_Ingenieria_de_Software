# Nombre de tu aplicación
spring.application.name=springboot-applications
# Importar variables desde .env si existe


# Variables de entorno con valores por defecto para la BD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practicas_db?serverTimezone=UTC}
spring.datasource.username=${DB_USER:app_practicas}
spring.datasource.password=${DB_PASSWORD:TuClaveSegura2026!}

# Configuración de JPA (Crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
gemini.api.key=${GEMINI_API_KEY}
